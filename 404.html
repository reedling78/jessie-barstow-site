<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — The Traveling Jessie Barstow</title>
<meta name="description" content="That door led somewhere else.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0a1622">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a1622;--gold:#e9b949;--gold-soft:#f4d58d;--teal:#54c9d1;--ink:#eef4f6;--muted:#9fb3bf;--line:rgba(84,201,209,.18)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Nunito Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.65;
    min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px}
  .backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1200px 600px at 70% -10%, rgba(84,201,209,.12), transparent 60%),
      radial-gradient(900px 500px at 10% 10%, rgba(202,169,184,.08), transparent 60%),
      linear-gradient(180deg,#0c1c2b 0%, var(--bg) 55%, #081320 100%)}
  .stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.45;
    background:
      radial-gradient(1.4px 1.4px at 22% 28%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 72% 18%, #fff, transparent),
      radial-gradient(1px 1px at 42% 66%, var(--teal), transparent),
      radial-gradient(1.4px 1.4px at 86% 58%, #fff, transparent),
      radial-gradient(1px 1px at 62% 82%, var(--gold-soft), transparent),
      radial-gradient(1px 1px at 12% 78%, #fff, transparent)}
  .card{position:relative;z-index:1;max-width:560px}
  .kicker{font-family:"Cinzel",serif;letter-spacing:.22em;text-transform:uppercase;
    font-size:.78rem;color:var(--teal);margin-bottom:14px}
  h1{font-family:"Cinzel",serif;font-size:clamp(1.8rem,5vw,2.6rem);color:var(--gold);line-height:1.15;margin-bottom:16px}
  p{color:var(--muted);margin-bottom:28px}
  .btn{display:inline-block;font-weight:700;font-size:.95rem;padding:12px 22px;border-radius:999px;
    background:var(--gold);color:#12202e;text-decoration:none;border:1px solid var(--gold);margin:0 6px 10px}
  .btn.ghost{background:transparent;color:var(--gold-soft);border-color:var(--line)}
  .btn:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<div class="backdrop"></div><div class="stars"></div>
<main class="card">
  <p class="kicker">Error 404</p>
  <h1>That door led somewhere else</h1>
  <p>Jessie would tell you not every doorway opens where you expect. This one opens back home.</p>
  <a class="btn" href="/">Back to the book</a>
  <a class="btn ghost" href="https://mattwarnockauthor.web.app">Author site</a>
</main>
</body>
</html>
